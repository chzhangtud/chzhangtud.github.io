zh:
  reset: 重置
  loading: 正在准备图表。
  chair:
    title: 一把椅子的坐标怎样逐渐变成噪声？
    hint: 左图由六个长方体表面按面积采样 768 点构成，并非 ShapeNet 数据。右图按 xₜ=a x₀+b ε 加噪，a=exp(−5t)，b=√(1−a²)。噪声固定，坐标范围固定；这是前向边缘分布示意，没有训练网络。
    fallback: 信号系数逐渐减小，坐面、椅背与椅腿被高斯噪声淹没。
    controls:
      - {key: t, label: 加噪时间 t, min: 0, max: 1, step: 0.01, value: 0.08}
      - {key: angle, label: 观察角度 / 度, min: -90, max: 90, step: 5, value: 35}
  chair-flow:
    title: Flow Matching 训练时，怎样连接噪声与已知椅子？
    hint: 右图为 xₜ=(1−t)z+t y，t=0 是固定高斯点团，t=1 是左侧的教学椅子。椅子由程序构造，并非 ShapeNet 数据。这是已知端点的训练插值，没有用速度网络生成新形状。
    fallback: 训练时把噪声和已知椅子按时间线性混合，监督速度为 y−z。
    controls:
      - {key: t, label: 生成时间 t, min: 0, max: 1, step: 0.01, value: 0.65}
      - {key: angle, label: 观察角度 / 度, min: -90, max: 90, step: 5, value: 35}
  mnist:
    title: 同一张 MNIST 图像在不同噪声水平下保留了什么？
    hint: 左图来自官方测试集，并沿用 VAE 文章的二值化预处理。右图用固定高斯噪声展示前向边缘分布；拖动滑块不会重新抽噪声，也不构成一条马尔可夫链轨迹。显示时把超出 [-1,1] 的值截断，实际计算不截断。这里没有训练或运行去噪网络。
    fallback: 前向加噪逐渐削弱数字笔画，并使噪声占据主导。正文给出了精确公式。
    controls:
      - {key: t, label: 噪声时间 t, min: 0, max: 1, step: 0.01, value: 0.3}
      - {key: digit, label: 测试图像序号, min: 0, max: 9, step: 1, value: 0}
  posterior:
    title: 条件均值为什么可能落在两个合理答案之间？
    hint: 原始标量来自均值为 -2 与 2、标准差为 0.25 的等权高斯混合。加性噪声标准差为 σ。蓝线是给定观测 y 后的真实后验，棕色竖线是后验均值。它解释均值与样本的区别，不是图像网络的预测结果。
    fallback: 模糊观测可能对应两个后验峰，后验均值可能位于两个峰之间。
    controls:
      - {key: sigma, label: 噪声标准差 σ, min: 0.3, max: 3, step: 0.05, value: 1.5}
      - {key: y, label: 带噪观测 y, min: -3, max: 3, step: 0.05, value: 0}
  sampler:
    title: 同一个速度场为什么会被不同求解器走成不同的轨迹？
    hint: 解析速度场为 dx/dt=-πy/2、dy/dt=πx/2，初值为 (1,0)，积分区间为 [0,1]。真实轨迹沿单位圆转过 90°。蓝色为 Euler，棕色为 Heun，灰色为解析轨迹。这是数值误差演示，不是 DDPM 或 DDIM 的质量比较。
    fallback: Euler 的有限步长会让旋转轨迹向外漂移，Heun 在这个例子中更接近单位圆。
    controls:
      - {key: steps, label: 积分步数, min: 2, max: 40, step: 1, value: 5}
  score:
    title: 概率密度、Score 与噪声尺度之间有什么关系？
    hint: 目标是两个高斯峰；每个峰的原始标准差为 0.25，前向过程增加标准差为 σ 的高斯噪声。蓝线画加噪后的密度，棕线画其对数密度对 x 的导数。两个视图共用 x 坐标；Score 的零点也可能是密度谷底。
    fallback: 小噪声时 Score 指向邻近密度峰，大噪声时两个峰逐渐合并。
    controls:
      - {key: sigma, label: 噪声标准差 σ, min: 0.1, max: 3, step: 0.05, value: 0.6}
  jacobian:
    title: 可逆变换怎样通过局部面积变化改变概率密度？
    hint: 变换为 x=z₁、y=exp(a z₁)z₂+0.4sin(2z₁)。每个网格单元携带相同的概率质量，因为源分布在 [-1,1]² 上均匀。右图面积越大的单元，平均密度越低；页面显示 z₁=0.5 处的面积倍率。
    fallback: 可逆变换保留概率质量。局部面积增大时，概率密度按面积倍率的倒数变化。
    controls:
      - {key: a, label: 伸缩系数 a, min: -0.8, max: 0.8, step: 0.05, value: 0.6}
  matching:
    title: 条件训练路径是直线，边缘速度场的采样轨迹仍然可以弯曲
    hint: 噪声来自 N(0,1)，数据来自均值 ±2、标准差 0.25 的等权混合。灰色虚线是独立配对的条件直线，蓝线通过解析边缘速度场积分得到；两组线没有逐样本对应关系。竖线标出当前 t，右图给出同一时刻的边缘密度。这是解析分布演示，没有训练网络。
    fallback: 条件速度经过对所有可能配对的条件平均，产生的边缘流通常不是原先的某一条直线。
    controls:
      - {key: t, label: 生成时间 t, min: 0, max: 1, step: 0.01, value: 0.5}
  bunny:
    title: Stanford Bunny 的表面结构怎样随坐标噪声消失？
    hint: 点来自 Stanford University Computer Graphics Laboratory 的真实 Bunny 网格，按三角形面积采样 1024 个点，平移并统一缩放后添加三维各向同性高斯噪声。左右两图共用正交投影和坐标范围。它只展示一件物体的前向加噪，不代表学习了兔子类别，也没有生成新形状。
    fallback: 坐标噪声会破坏耳朵等细节并使表面增厚。正文解释如何把这样的过程扩展成形状分布模型。
    controls:
      - {key: sigma, label: 坐标噪声标准差 σ, min: 0, max: 0.5, step: 0.01, value: 0.1}
      - {key: angle, label: 绕竖直轴旋转 / 度, min: -90, max: 90, step: 5, value: 0}
  correspondence:
    title: 同样的起点和终点点集，为什么会产生不同的中间形状？
    hint: 两端分别为 64 个圆周点和 64 个椭圆周点。左图按角度对应，右图用固定的随机排列对应。端点点集完全相同，中间插值由对应关系决定。这里的角度对应只适用于这个构造例子，不能直接推广到任意 ShapeNet 形状。
    fallback: 不同的点对应会让相同端点集合产生不同的中间几何。
    controls:
      - {key: t, label: 插值时间 t, min: 0, max: 1, step: 0.01, value: 0.5}
en:
  reset: Reset
  loading: Preparing figure.
  chair:
    title: How do chair coordinates turn into noise?
    hint: The left panel samples 768 points by face area from six procedural boxes; it is not ShapeNet data. The right uses xₜ=a x₀+b ε, with a=exp(−5t) and b=√(1−a²). Noise and axis limits stay fixed. This shows forward marginals, with no trained network.
    fallback: As the signal coefficient decreases, Gaussian noise obscures the seat, back, and legs.
    controls:
      - {key: t, label: Corruption time t, min: 0, max: 1, step: 0.01, value: 0.08}
      - {key: angle, label: View angle / degrees, min: -90, max: 90, step: 5, value: 35}
  chair-flow:
    title: How does FM connect noise to a known training chair?
    hint: The right panel shows xₜ=(1−t)z+t y. At t=0 it is fixed Gaussian noise; at t=1 it is the procedural chair on the left, not ShapeNet data. This is a training interpolation with known endpoints, not a new shape generated by a velocity network.
    fallback: Training mixes noise and a known chair linearly, with target velocity y−z.
    controls:
      - {key: t, label: Generation time t, min: 0, max: 1, step: 0.01, value: 0.65}
      - {key: angle, label: View angle / degrees, min: -90, max: 90, step: 5, value: 35}
  mnist:
    title: What survives when we add noise to a real MNIST image?
    hint: The left input is an official test image binarized as in the VAE article. The right panel uses fixed Gaussian noise to visualize forward marginals, not a Markov-chain trajectory. Values are clipped to [-1,1] only for display. No denoising network is trained or run here.
    fallback: The forward process weakens the digit strokes while noise becomes dominant. The text provides the exact formula.
    controls:
      - {key: t, label: Noise time t, min: 0, max: 1, step: 0.01, value: 0.3}
      - {key: digit, label: Test image index, min: 0, max: 9, step: 1, value: 0}
  posterior:
    title: Why can a conditional mean lie between plausible answers?
    hint: Clean scalars follow an equal Gaussian mixture with means -2 and 2 and standard deviation 0.25. Additive noise has standard deviation σ. Blue shows the exact posterior given y; the ochre line is its mean. This is an analytic example, not a trained image prediction.
    fallback: An ambiguous observation can have two posterior modes with its conditional mean between them.
    controls:
      - {key: sigma, label: Noise standard deviation σ, min: 0.3, max: 3, step: 0.05, value: 1.5}
      - {key: y, label: Noisy observation y, min: -3, max: 3, step: 0.05, value: 0}
  sampler:
    title: How do numerical solvers change a trajectory in the same field?
    hint: The analytic field is dx/dt=-πy/2, dy/dt=πx/2, starting from (1,0) on [0,1]. The exact path turns 90 degrees along the unit circle. Blue is Euler, ochre is Heun, and gray is exact. This illustrates integration error; it does not compare DDPM and DDIM sample quality.
    fallback: Euler drifts outward at finite step size; Heun stays closer to the circle in this example.
    controls:
      - {key: steps, label: Integration steps, min: 2, max: 40, step: 1, value: 5}
  score:
    title: How do density and score change with the noise scale?
    hint: Two Gaussian modes have original standard deviation 0.25; forward noise adds standard deviation σ. Blue shows the perturbed density and ochre its log-density derivative. The views share x coordinates. A score zero can also be a density minimum.
    fallback: At low noise the score points toward nearby modes; sufficiently large noise merges the modes.
    controls:
      - {key: sigma, label: Noise standard deviation σ, min: 0.1, max: 3, step: 0.05, value: 0.6}
  jacobian:
    title: How does an invertible warp change density through local area?
    hint: The map is x=z₁, y=exp(a z₁)z₂+0.4sin(2z₁). Source cells carry equal mass under a uniform distribution on [-1,1]². Larger transformed cells have lower average density. The readout reports the local area multiplier at z₁=0.5.
    fallback: Invertible maps preserve probability mass; density changes inversely with local area expansion.
    controls:
      - {key: a, label: Stretch parameter a, min: -0.8, max: 0.8, step: 0.05, value: 0.6}
  matching:
    title: Straight conditional paths can produce curved marginal flow trajectories
    hint: Noise is N(0,1); data follow equal Gaussian modes at ±2 with standard deviation 0.25. Gray dashed lines are independently paired conditional paths. Blue paths integrate the exact marginal field and are not paired with individual gray paths. The vertical line selects t; the other view shows its marginal density. No network is trained.
    fallback: Conditional averaging over possible endpoint pairs produces a marginal flow that generally does not follow any one training segment.
    controls:
      - {key: t, label: Generation time t, min: 0, max: 1, step: 0.01, value: 0.5}
  bunny:
    title: How does coordinate noise destroy the Stanford Bunny surface?
    hint: We area-sample 1024 points from the real Bunny mesh, credited to Stanford University Computer Graphics Laboratory, then center and uniformly scale it before adding isotropic 3D Gaussian noise. Both orthographic views share coordinate ranges. This is one object's forward corruption, not a learned shape distribution or a generated rabbit.
    fallback: Coordinate noise thickens the surface and hides small structures such as the ears.
    controls:
      - {key: sigma, label: Coordinate noise SD σ, min: 0, max: 0.5, step: 0.01, value: 0.1}
      - {key: angle, label: Y-axis rotation / degrees, min: -90, max: 90, step: 5, value: 0}
  correspondence:
    title: Why do identical endpoint point sets yield different intermediate shapes?
    hint: Endpoints are 64 circle points and 64 ellipse points. The left view pairs by angle; the right uses a fixed random permutation. Endpoint sets agree exactly, while intermediate geometry depends on the pairing. Angular correspondence works for this constructed example, not arbitrary ShapeNet objects.
    fallback: Different point correspondences yield different interpolated geometry even with identical endpoint sets.
    controls:
      - {key: t, label: Interpolation time t, min: 0, max: 1, step: 0.01, value: 0.5}
