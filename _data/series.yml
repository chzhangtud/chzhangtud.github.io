- id: numerical-analysis
  zh:
    title: 数值分析讲义
    description: 从插值、数值积分到微分方程、线性方程组与特征值计算，按讲义顺序阅读。
    url: /zh/series/numerical-analysis/
  en:
    title: Numerical Analysis Lectures
    description: Read in lecture order, from interpolation and integration to differential equations, linear systems, and eigenvalues.
    url: /en/series/numerical-analysis/
- id: machine-learning
  zh:
    title: 机器学习基础
    description: 从概率统计出发，理解机器学习中的建模、推断与优化。
    url: /zh/series/machine-learning/
  en:
    title: Machine Learning Foundations
    description: Probability, statistical reasoning, and the foundations of learning from data.
    url: /en/series/machine-learning/
- id: generative-models
  zh:
    title: 生成模型
    description: 从隐变量、变分推断与 VAE 出发，理解扩散模型、连续流与 Flow Matching，并联系图像、点云和几何生成。
    url: /zh/series/generative-models/
  en:
    title: Generative Models
    description: From latent variables, variational inference, and VAEs to diffusion, continuous flows, and flow matching, with image and geometry examples.
    url: /en/series/generative-models/
- id: graphics
  zh:
    title: 图形
    description: 实时渲染、抗锯齿、阴影、光线追踪，以及图形开发中的实践与调试。
    url: /zh/series/graphics/
  en:
    title: Graphics
    description: Articles on real-time rendering, anti-aliasing, shadows, ray tracing, and graphics development.
    url: /en/series/graphics/
- id: cpp
  zh:
    title: C++
    description: C++ 编程、内存优化与工程实践。
    url: /zh/series/cpp/
  en:
    title: C++
    description: C++ programming, memory optimization, and engineering practice.
    url: /en/series/cpp/
